# Each case is sent to BOTH images; responses must match (Date/gzip normalized).
# kind: http  -> sent with the requests library
# kind: raw   -> sent as raw bytes over a socket (for malformed requests that a
#                normal HTTP client would "fix" before sending)

- {name: root,              kind: http, method: GET,  path: /}
- {name: not_found,         kind: http, method: GET,  path: /does-not-exist}
- {name: head_root,         kind: http, method: HEAD, path: /}
- {name: static_text,       kind: http, method: GET,  path: /big.txt}
- {name: range,             kind: http, method: GET,  path: /big.txt, headers: {Range: "bytes=0-99"}}
- {name: range_unsat,       kind: http, method: GET,  path: /big.txt, headers: {Range: "bytes=999999-"}}
- {name: conditional_future,kind: http, method: GET,  path: /big.txt, headers: {If-Modified-Since: "Thu, 31 Dec 2099 23:59:59 GMT"}}
- {name: gzip,              kind: http, method: GET,  path: /big.txt, headers: {Accept-Encoding: "gzip"}}
- {name: redirect,          kind: http, method: GET,  path: /redirect}
- {name: post_not_allowed,  kind: http, method: POST, path: /, body_bytes: 10}
- {name: body_too_large,    kind: http, method: POST, path: /, body_bytes: 2048}

- {name: no_host_http11,    kind: raw, payload: "GET / HTTP/1.1\r\n\r\n"}
- {name: unknown_method,    kind: raw, payload: "WIBBLE / HTTP/1.1\r\nHost: localhost\r\n\r\n"}
- {name: http09,            kind: raw, payload: "GET /\r\n"}
- {name: bad_request_line,  kind: raw, payload: "not a request\r\n\r\n"}
