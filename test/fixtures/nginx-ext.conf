# Extended fixture shared by BOTH images (module_tls_test.py). Loads all six
# dynamic-module objects (so every module is load-checked), exercises two of
# them, serves over TLS, and exposes a plain (non-rewritten) alias location.
# Separate from nginx.conf so a failure here can't take down the base suite.
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
load_module /usr/lib/nginx/modules/ngx_http_image_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_geoip_module.so;
load_module /usr/lib/nginx/modules/ngx_stream_geoip_module.so;
load_module /usr/lib/nginx/modules/ngx_http_xslt_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_stream_js_module.so;

worker_processes  1;
error_log  /var/log/nginx/error.log  notice;
events { worker_connections  64; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;
    sendfile      on;

    js_import echo from /srv/echo.js;

    server {
        listen       80 default_server;
        listen       443 ssl;
        server_name  _;
        root         /srv;

        ssl_certificate     /etc/nginx/certs/test.crt;
        ssl_certificate_key /etc/nginx/certs/test.key;

        # njs dynamic module: a pure-JS response (no external library), so its
        # output is deterministic and safe to compare byte-for-byte.
        location = /njs { js_content echo.hello; }

        # image-filter dynamic module (links libgd): resize a PNG on the fly.
        # libgd may be newer in the rebuild, so the test asserts this WORKS
        # (valid, resized image) rather than byte-for-byte parity.
        location = /pic.png { image_filter resize 8 8; }

        # Plain alias, NO rewrite: the CVE-2026-15176 backport must leave this
        # untouched -- the guard only rejects alias mapping AFTER a rewrite.
        location /alias-ok/ { alias /srv/; }
    }
}
