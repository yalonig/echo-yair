# Test server shared by BOTH images, so any response difference is the image,
# not the config. Includes the CVE-2026-15176 trigger location.
worker_processes  1;
error_log  /var/log/nginx/error.log  notice;
events { worker_connections  64; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;
    sendfile      on;

    gzip             on;
    gzip_types       text/plain;
    gzip_min_length  16;

    client_max_body_size  1k;

    server {
        listen       80 default_server;
        server_name  _;
        root         /srv;

        location / { }

        location = /redirect { return 301 /; }

        # Large download: an 8 MiB file the test suite generates and mounts at /large.
        location /large/ { alias /large/; }

        # Large accepted upload: WebDAV PUT really reads the body (unlike
        # `return`, which discards it). A multi-MB body spills from memory into
        # /var/cache/nginx/client_temp, so this also checks that temp directory
        # exists and is writable by the nginx user. Files land in the container's
        # own /tmp and are served back by GET for a hash comparison.
        location /dav/ {
            root                  /tmp;
            dav_methods           PUT;
            create_full_put_path  on;
            client_max_body_size  16m;
        }

        # CVE-2026-15176 trigger: alias + rewrite + $request_filename.
        # Patched nginx refuses the mapping (alert logged, empty body); unpatched maps the path.
        location /foo/ {
            alias /bar/;
            rewrite ^/foo/.*$ /x;
            return 200 $request_filename;
        }
    }
}
